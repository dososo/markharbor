  <text x="302" y="392" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="500" fill="#344054">JSON, CSV, HTML, media manifests, and Obsidian vaults.</text>
