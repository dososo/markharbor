  <text x="302" y="286" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="650" fill="#123C43">X Bookmarks to Obsidian</text>
