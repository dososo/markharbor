name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    name: Test, typecheck, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Build extension
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Package extension artifact
        run: npm run package

      - name: Upload unpacked extension zip
        uses: actions/upload-artifact@v7
        with:
          name: markharbor-extension
          path: release/*.zip
          if-no-files-found: error
