<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">MarkHarbor social preview</title>
  <desc id="desc">A local-first X Bookmarks to Obsidian exporter.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101828"/>
      <stop offset="48%" stop-color="#123C43"/>
      <stop offset="100%" stop-color="#F4B860"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.90"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <path d="M0 500 C190 430 330 590 520 510 C760 410 900 505 1280 420 L1280 640 L0 640 Z" fill="#0B1220" opacity="0.28"/>
  <rect x="76" y="78" width="1128" height="484" rx="36" fill="url(#panel)"/>
  <rect x="112" y="114" width="1056" height="412" rx="24" fill="#FFFFFF" opacity="0.74"/>
  <g transform="translate(154 158)">
