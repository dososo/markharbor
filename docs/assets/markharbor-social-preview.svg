    <path d="M29 72 C47 44 67 44 84 72" fill="none" stroke="#F4B860" stroke-width="10" stroke-linecap="round"/>
    <path d="M34 39 L78 39" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
